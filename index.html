    <style>
        :root {
            --bg-grad: radial-gradient(circle at 50% 0%, #0a1128 0%, #030712 100%);
            --emerald: #00ff87;
            --cyan: #60efff;
            --emerald-glow: rgba(0, 255, 135, 0.4);
            --card-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(0, 255, 135, 0.25);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 390px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            position: relative;
            z-index: 1;
        }

        /* Top Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 135, 0.08);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 800;
            color: var(--emerald);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--emerald);
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1.15); }
        }

        /* Profile Photo Container */
        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--cyan));
            opacity: 0.8;
            filter: blur(6px);
        }

        .avatar-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0a1128;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Title Box */
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(0, 255, 135, 0.3);
        }

        .brand-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 6px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--emerald);
        }

        .stat-lbl {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* High CTA Button */
        .cta-box {
            width: 100%;
        }

        .cta-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #00ff87 0%, #00b894 100%);
            color: #030712;
            font-size: 19px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 25px var(--emerald-glow);
            animation: glowPulse 1.8s infinite;
            overflow: hidden;
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: rotate(30deg);
            animation: sweep 2.2s infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 135, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 35px rgba(0, 255, 135, 0.85); }
        }

        /* Timer Box */
        .timer-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-glass);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .timer-clock {
            font-size: 22px;
            font-weight: 900;
            color: var(--emerald);
            font-family: monospace;
        }

        /* Footer Credit */
        .footer {
            font-size: 11px;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--emerald);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Dynamic Join Popup */
        .fomo-pop {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--emerald);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
            white-space: nowrap;
        }
    </style>

    <script>
        // Timer Script
        let timeLeft = 15;
        const timerDisplay = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerText = "00:00";
            } else {
                timeLeft--;
                timerDisplay.innerText = "00:" + (timeLeft < 10 ? '0' + timeLeft : timeLeft);
            }
        }, 1000);

        // FOMO Popup Simulation
        const names = ["Aman S.", "Vikram R.", "Rohan K.", "Priya P.", "Sameer N.", "Karan T."];

            const randomName = names[Math.floor(Math.random() * names.length)];
            fomo.innerHTML = `<span style="color: var(--emerald);">🔥 ${randomName}</span> just joined the VIP Channel!`;
        }, 3500);
